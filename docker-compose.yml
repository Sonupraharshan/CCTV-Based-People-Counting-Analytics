version: '3.8'

services:
  people-counter:
    build:
      context: .
      dockerfile: Dockerfile
    image: cctv-people-counter:latest
    container_name: people-counter-app
    
    # GPU support (requires nvidia-docker)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    
    ports:
      - "8501:8501"  # Streamlit UI
    
    volumes:
      # Mount models directory for persistence
      - ./models:/app/models
      # Mount database for event logs
      - ./database:/app/database
      # Mount examples for demo videos
      - ./examples:/app/examples
      # Mount datasets if available
      - ./datasets:/app/datasets
      # Mount logs
      - ./logs:/app/logs
    
    environment:
      # CUDA settings
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
      # Application settings
      - DETECTION_CONFIDENCE=0.5
      - TRACKER_TYPE=strongsort
      - MIN_TRACK_LENGTH=10
      # Enable GPU
      - CUDA_VISIBLE_DEVICES=0
    
    restart: unless-stopped
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

